name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      library_version:
        description: 'Published library version, X.Y.Z or vX.Y.Z'
        required: true
        type: string
      publish:
        description: 'Publish tested images to GHCR and Docker Hub'
        required: true
        default: true
        type: boolean
      image_tag:
        description: 'Optional immutable image tag, e.g. 0.1.0-r1 (default: library version)'
        required: false
        type: string

permissions:
  contents: read

# Serialize publication and its retry guards, including manual executions.
concurrency:
  group: docker-image-publication
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      archive_sha256: ${{ steps.release.outputs.archive_sha256 }}
      recipe_sha256: ${{ steps.release.outputs.recipe_sha256 }}
      ghcr_image: ${{ steps.registries.outputs.ghcr_image }}
      dockerhub_image: ${{ steps.registries.outputs.dockerhub_image }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test release and image helpers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc
          python -m unittest discover -s tests -v
      - name: Validate registry configuration
        id: registries
        env:
          PUBLISH_IMAGES: ${{ inputs.publish }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          LIBRARY_VERSION: ${{ inputs.library_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          publish = os.environ['PUBLISH_IMAGES'] == 'true'
          version = os.environ['LIBRARY_VERSION'].removeprefix('v')
          image_tag = os.environ.get('IMAGE_TAG', '') or version
          stable = r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
          suffix = r'(?:-[a-z0-9]+(?:[._-][a-z0-9]+)*)?'
          if not re.fullmatch(stable, version) or len(image_tag) > 128 or not re.fullmatch(re.escape(version) + suffix, image_tag):
              raise SystemExit('Use a stable library version and an image tag such as 0.1.0 or 0.1.0-r1.')
          username = os.environ.get('DOCKERHUB_USERNAME', '')
          namespace = os.environ.get('DOCKERHUB_NAMESPACE', '') or username
          if publish and (not username or not os.environ.get('DOCKERHUB_TOKEN')):
              raise SystemExit('Set repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN before publishing images.')
          if namespace and not re.fullmatch(r'[a-z0-9]+(?:[._-][a-z0-9]+)*', namespace.lower()):
              raise SystemExit('DOCKERHUB_NAMESPACE must be a valid Docker Hub account or organization name.')
          owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          namespace = namespace.lower() or 'local'
          if publish:
              public_url = f'https://hub.docker.com/v2/namespaces/{namespace}/repositories/tex-templates'
              try:
                  request = urllib.request.Request(public_url, headers={'User-Agent': 'tex-templates-ci'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      repository = json.load(response)
              except (urllib.error.URLError, json.JSONDecodeError) as exc:
                  raise SystemExit(f'Create a PUBLIC Docker Hub repository {namespace}/tex-templates before publishing; public lookup failed: {exc}')
              if repository.get('is_private') is not False:
                  raise SystemExit(f'Docker Hub repository {namespace}/tex-templates must be PUBLIC.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'ghcr_image=ghcr.io/{owner}/tex-templates\n')
              output.write(f'dockerhub_image=docker.io/{namespace}/tex-templates\n')
          PY
      - name: Prepare the verified released library and source fixtures
        id: release
        env:
          LIBRARY_VERSION: ${{ inputs.library_version }}
        run: python scripts/docker-release.py prepare --version "$LIBRARY_VERSION" --output build/docker --github-output "$GITHUB_OUTPUT"
      - name: Share the verified build context
        run: tar -C build/docker -cf build/verified-docker-context.tar .
      - name: Upload the build context with executable modes preserved
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-docker-context
          path: build/verified-docker-context.tar
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-docker-context
          path: build/
      - name: Restore the verified build context
        run: |
          mkdir -p build/docker
          tar -xf build/verified-docker-context.tar -C build/docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Fix image timestamps for the test and registry export
        id: epoch
        run: echo "value=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and load the native image for testing
        id: tested
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: build/docker/
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: tex-templates:test
          provenance: false
          sbom: false
          build-args: |
            LIBRARY_VERSION=${{ needs.prepare.outputs.version }}
            LIBRARY_COMMIT=${{ needs.prepare.outputs.commit }}
            LIBRARY_SHA256=${{ needs.prepare.outputs.archive_sha256 }}
            RECIPE_SHA256=${{ needs.prepare.outputs.recipe_sha256 }}
          cache-from: type=gha,scope=tex-templates-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tex-templates-${{ matrix.arch }}
      - name: Compile every template with the image's non-root account
        run: docker/smoke-test.sh tex-templates:test "$PWD/build/docker/fixtures"
      - name: Record the exact tested image configuration
        run: |
          mkdir -p build/digests
          docker image inspect tex-templates:test --format '{{.Id}}' > build/tested-config-digest
      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Re-export the cached build by digest, without assigning public version tags.
      - name: Export the tested native image to both registries by digest
        if: inputs.publish
        id: export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: build/docker/
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.ghcr_image }}
            ${{ needs.prepare.outputs.dockerhub_image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: false
          sbom: false
          build-args: |
            LIBRARY_VERSION=${{ needs.prepare.outputs.version }}
            LIBRARY_COMMIT=${{ needs.prepare.outputs.commit }}
            LIBRARY_SHA256=${{ needs.prepare.outputs.archive_sha256 }}
            RECIPE_SHA256=${{ needs.prepare.outputs.recipe_sha256 }}
      - name: Confirm both exported images are exactly the tested configuration
        if: inputs.publish
        env:
          IMAGE_DIGEST: ${{ steps.export.outputs.digest }}
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.dockerhub_image }}
          ARCH: ${{ matrix.arch }}
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools inspect "$image@$IMAGE_DIGEST" --raw > build/exported-manifest.json
            remote_config=$(python -c 'import json; print(json.load(open("build/exported-manifest.json"))["config"]["digest"])')
            test "$remote_config" = "$(cat build/tested-config-digest)"
          done
          printf '%s\n' "$IMAGE_DIGEST" > "build/digests/$ARCH"
      - name: Share the tested architecture digest
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-digest-${{ matrix.arch }}
          path: build/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download both tested architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-digest-*
          path: build/digests/
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable version tags after both native tests passed
        env:
          LIBRARY_VERSION: ${{ needs.prepare.outputs.version }}
          LIBRARY_COMMIT: ${{ needs.prepare.outputs.commit }}
          LIBRARY_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
          RECIPE_SHA256: ${{ needs.prepare.outputs.recipe_sha256 }}
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.dockerhub_image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python scripts/docker-release.py publish-images \
            --version "$LIBRARY_VERSION" --commit "$LIBRARY_COMMIT" \
            --archive-sha256 "$LIBRARY_SHA256" --recipe-sha256 "$RECIPE_SHA256" \
            --digests build/digests --image "$GHCR_IMAGE" --image "$DOCKERHUB_IMAGE" \
            --image-tag "$IMAGE_TAG" \
            --github-summary "$GITHUB_STEP_SUMMARY"

name: Library checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release helper and shell entry points
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc
          python -m unittest discover -s tests -v
          for script in bin/*.sh; do
            sh -n "$script"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the shared Mermaid renderer
        run: bin/setup-mermaid.sh
      - name: Assemble a source preview without release credentials
        run: python scripts/library-release.py preview --output build/preview
      - name: Install the example's TeX environment
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pandoc latexmk texlive-luatex texlive-latex-extra \
            texlive-fonts-extra texlive-science texlive-lang-english texlive-lang-italian poppler-utils
      - name: Use the image's Pandoc version for PDF integration checks
        run: |
          pandoc_version=$(sed -n 's/^ARG PANDOC_VERSION=//p' docker/Dockerfile)
          pandoc_sha=$(sed -n 's/^ARG PANDOC_SHA256_AMD64=//p' docker/Dockerfile)
          pandoc_archive="$RUNNER_TEMP/pandoc.tar.gz"
          pandoc_install="$RUNNER_TEMP/pandoc-image-version"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/jgm/pandoc/releases/download/$pandoc_version/pandoc-$pandoc_version-linux-amd64.tar.gz" \
            -o "$pandoc_archive"
          printf '%s  %s\n' "$pandoc_sha" "$pandoc_archive" | sha256sum --check -
          mkdir -p "$pandoc_install"
          tar -xzf "$pandoc_archive" -C "$pandoc_install" --strip-components=1
          echo "$pandoc_install/bin" >> "$GITHUB_PATH"
          "$pandoc_install/bin/pandoc" --version
      - name: Compile source fixtures using the extracted distribution
        run: |
          mkdir -p build/distribution build/fixtures
          tar -xzf build/preview/tex-templates-0.0.0.tar.gz -C build/distribution
          export TEX_TEMPLATES_HOME="$PWD/build/distribution/tex-templates"
          export TEX_TEMPLATES_CONFIG_HOME="$RUNNER_TEMP/template-selection-ci"
          "$TEX_TEMPLATES_HOME/bin/template-list.sh"
          for template in "$TEX_TEMPLATES_HOME"/templates/*; do
            id=$(basename "$template")
            source_fixture="templates/$id/usage_example"
            if [ ! -d "$source_fixture" ]; then
              echo "Missing source example for template $id" >&2
              exit 1
            fi
            fixture="$PWD/build/fixtures/$id/usage_example"
            mkdir -p "$fixture"
            cp -R "$source_fixture/." "$fixture/"
            smoke_pdf="$fixture/build/smoke.pdf"
            rm -f "$smoke_pdf"
            "$TEX_TEMPLATES_HOME/bin/generate-pdf.sh" --project "$fixture" --template "$id" -- -o "$smoke_pdf"
            test -s "$smoke_pdf"
          done
      - name: Check shared boxes, localized captions, section cards and Mermaid
        env:
          TEX_TEMPLATES_HOME: ${{ github.workspace }}/build/distribution/tex-templates
        run: python tests/check_template_features.py
